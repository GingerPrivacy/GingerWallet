name: UnitTests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    name: Unit tests (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-15
            runtime: osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: unit-tests-${{ runner.os }}-${{ matrix.runtime }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            unit-tests-${{ runner.os }}-${{ matrix.runtime }}-nuget-

      - name: Install dependencies
        # These tests use the installed .NET runtime, so self-contained runtime packs are unnecessary.
        run: dotnet restore --locked-mode -p:EnableRuntimePackDownload=false

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:EnableRuntimePackDownload=false

      - name: Test
        run: dotnet test --no-restore --no-build --configuration Release --filter "UnitTests" --logger "console;verbosity=minimal"
        
